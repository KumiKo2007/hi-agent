name: Conversation regression baseline

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test existing chat HTTP/SSE flow with deterministic model
        working-directory: AgentX
        run: ./mvnw -B -ntp -Dtest=PortalChatRegressionTest -DforkedProcessTimeoutInSeconds=60 test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agentx-frontend-plus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: agentx-frontend-plus/package-lock.json
      - run: npm ci --legacy-peer-deps --include=optional
      - run: npm run test:chat
      - run: npm run lint
      - run: npm run build
